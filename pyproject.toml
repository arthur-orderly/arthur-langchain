[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthur-langchain"
version = "0.1.0"
description = "LangChain tools for trading perpetuals on Arthur DEX (Orderly Network)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["langchain", "arthur", "orderly", "perps", "trading", "defi", "ai-agent"]
dependencies = [
    "langchain-core>=0.1.0",
    "arthur-sdk>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
include = ["arthur_langchain*"]
